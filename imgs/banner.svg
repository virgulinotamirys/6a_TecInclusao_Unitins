<svg viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ilustração decorativa: rede de conexões, notebook com código e pessoas">

  <!-- rede de conexões — esquerda, centralizada na faixa vertical segura -->
  <g opacity="0.22" stroke="#ffffff" stroke-width="2" fill="#ffffff">
    <line x1="70" y1="160" x2="170" y2="210" />
    <line x1="170" y1="210" x2="140" y2="300" />
    <line x1="170" y1="210" x2="260" y2="180" />
    <line x1="140" y1="300" x2="70" y2="160" />
    <circle cx="70" cy="160" r="8" />
    <circle cx="170" cy="210" r="10" />
    <circle cx="140" cy="300" r="6" />
    <circle cx="260" cy="180" r="7" />
  </g>

  <!-- notebook com código — direita -->
  <g opacity="0.85" transform="translate(960,150)">
    <rect x="0" y="0" width="150" height="95" rx="6" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-width="2" />
    <text x="75" y="58" font-family="Consolas, monospace" font-size="28" fill="#ffffff" text-anchor="middle">&lt;/&gt;</text>
    <rect x="-10" y="95" width="170" height="10" rx="3" fill="#ffffff" fill-opacity="0.25" />
  </g>

  <!-- pessoas — esquerda, abaixo da rede de conexões -->
  <g opacity="0.25" fill="#ffffff">
    <circle cx="90" cy="305" r="15" />
    <path d="M62 352 Q90 316 118 352 Z" />
    <circle cx="150" cy="312" r="12" />
    <path d="M129 352 Q150 320 171 352 Z" />
  </g>

  <!-- pontos de destaque -->
  <g opacity="0.3" fill="#f59e0b">
    <circle cx="420" cy="160" r="4" />
    <circle cx="700" cy="150" r="3" />
    <circle cx="900" cy="340" r="4" />
    <circle cx="350" cy="330" r="3" />
  </g>
</svg>
